version: 2

# Dependabot 成熟治理（architecture-recovery）
# - 5 个生态系统：C# / Rust service / Rust Tauri shell / npm / GitHub Actions
# - 噪音治理：weekly → monthly；open-pull-requests-limit 2-3
# - 安全更新独立组（不等 minor/patch 批），critical advisory 不被日常 bump 队列阻塞
# - 每个 group 至少声明 patterns / update-types / dependency-type / exclude-patterns /
#   group-by 之一：只有 applies-to 的组会被 Dependabot 校验器拒绝
# - minor/patch 组 auto-merge（跨 major 不在范围，required checks 全绿门）
# - ignore 仅用于「钉死不升」的 major（理由见下方注释）

updates:
  # ===== nuget — C# 引擎 + Tests + Fuzz =====
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
      # 周一上午跑（避开周末）；与 release-please push 不同步
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    # 所有 PR 统一打这两个 label（group label 会附加）
    labels:
      - "dependencies"
      - "ecosystem:nuget"
    # dependabot 默认从 PR 标题前缀推断 commit type（chore(deps)）；
    # 团队沿用 conventional-commit 故此处不覆盖 commit-message
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        # group 默认会带 "dependencies" label；附加 ecosystem+分组标签便于过滤
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        # security 组与 minor-patch 组不混批——critical advisory 不被日常 bump 队列阻塞
    # 钉死不升的 major：依赖本次窗口不升；理由见注释
    ignore:
      # Microsoft.Extensions.Compliance.Redaction 升级会牵动 9.0→10.0 主线特性集（net10 SDK 切换）
      # 等 .NET 11 走稳或团队评审通过后再升；当前 9.0.0 满足 PII 标 redact 用例。
      - dependency-name: "Microsoft.Extensions.Compliance.Redaction"
        versions: [">= 10.0.0"]
        # （deferred major：等待团队评审 .NET 主线升级决议）

  # ===== cargo — Rust service crate =====
  - package-ecosystem: cargo
    directory: /service
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ecosystem:cargo"
      - "component:service"
    groups:
      service-cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      service-cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # ===== cargo — Tauri shell =====
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ecosystem:cargo"
      - "component:tauri-shell"
    groups:
      tauri-cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      tauri-cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # ===== npm — Svelte frontend =====
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ecosystem:npm"
      - "component:frontend"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # 钉死不升的 major：只钉当前栈之上的那个 major；当前栈自身的 minor/patch 必须能流动，
    # 否则换来的 patch 通道是纸面的。每条钉版都写明「为什么钉」。
    ignore:
      # svelte：当前栈 svelte 5.57.3（#28 迁移窗，PR #223 落地）。钉住的只有下一个 major
      # 6.x 及以上——6.x 要重做 runes 语义与 reactivity 写法 + 测试基线整体漂移，须独立
      # 工单评审；5.x 的 minor/patch（含安全更新）不再被压制。
      - dependency-name: "svelte"
        versions: [">= 6.0.0"]
      # typescript：当前栈 5.x（frontend/package.json ^5.0.0，锁定 5.9.3）。钉住 7.x 及以上
      # ——升 TS 7 触发 lib 升级 + 类型推断行为变化 + svelte-check / vitest 类型基线漂移，
      # 须先重做 Svelte/Vite 类型工具链兼容矩阵。
      - dependency-name: "typescript"
        versions: ["7.x"]
      # vite：当前栈 vite 8.3.5 + @sveltejs/vite-plugin-svelte 7.3.1（PR #223）。钉住的只有
      # 下一个 major 9.x 及以上——任一 major 都要重新跑 e2e + bundle 大小回归；8.x 的
      # minor/patch（含安全更新）不再被压制。
      - dependency-name: "vite"
        versions: [">= 9.0.0"]
      # tailwindcss：当前栈 3.x（frontend/package.json ^3.4.0）。钉住的只有 5.x 及以上
      # ——主版本跨代要单独开窗评审（#305 裁定）；4.x 是迁移目标，不拦：迁移窗升上 4.x
      # 后，其 minor/patch（含安全更新）走 npm-minor-patch 组自动合并。
      - dependency-name: "tailwindcss"
        versions: [">= 5.0.0"]
      # jsdom：当前测试环境 jsdom 25.x（frontend/package.json ^25.0.1）；26 起跨多个 major，须重测 DOM 模拟
      # 行为差异（MutationObserver / IntersectionObserver 语义），故钉 26.0.0 及以上。
      - dependency-name: "jsdom"
        versions: [">= 26.0.0"]
      # vitest 三件套（vitest / @vitest/ui / @vitest/coverage-v8）：当前栈 4.x；5.x 要重做
      # 测试基线并与 vite 8 / @sveltejs/vite-plugin-svelte 7 的 peer 组合验证，未经评审前
      # 钉住 5.x。
      - dependency-name: "vitest"
        versions: ["5.x"]
      - dependency-name: "@vitest/ui"
        versions: ["5.x"]
      - dependency-name: "@vitest/coverage-v8"
        versions: ["5.x"]

  # ===== github-actions =====
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ecosystem:github-actions"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
