name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      
      - name: Restore & Build CLI
        run: |
          cd .
          dotnet build -c Release
      
      - name: Test CLI
        run: |
          .\bin\Release\net10.0\env-manager.exe help
          .\bin\Release\net10.0\env-manager.exe list

  build-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Build Tauri
        run: |
          cd frontend
          npm run tauri-build

  release:
    needs: [build-cli, build-gui]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build CLI Release
        run: dotnet build -c Release
      
      - name: Build GUI Release
        run: |
          cd frontend
          npm ci
          npm run tauri-build
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/Release/net10.0/env-manager.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
