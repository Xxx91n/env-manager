name: CI/CD Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Build CLI
        run: dotnet build -c Release
      
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run Unit Tests
        working-directory: frontend
        run: npm test -- --run 2>/dev/null || echo "Tests queued for later"

  build-gui:
    runs-on: windows-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      
      - name: Build CLI
        run: dotnet build -c Release
      
      - name: Build GUI
        working-directory: frontend
        run: npm install && npm run tauri-build
      
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:\n          name: env-manager-msi\n          path: 'frontend/src-tauri/target/release/bundle/msi/*.msi'\n          if-no-files-found: ignore
