name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Semgrep Security Audit
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
          generateSarif: true
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep.sarif

  build-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      
      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      
      - name: Restore & Build CLI
        run: |
          dotnet build -c Release
      
      - name: Test CLI
        run: |
          .\bin\Release\net10.0\env-manager.exe help
          .\bin\Release\net10.0\env-manager.exe list
      
      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-manager-cli
          path: bin/Release/net10.0/env-manager.exe
          retention-days: 30

  build-gui:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend assets
        run: |
          cd frontend
          npm run build
      
      - name: Build Tauri app
        run: |
          cd frontend
          npm run tauri-build
        continue-on-error: true
      
      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: env-manager-gui
          path: |
            dist/
            frontend/src-tauri/target/release/bundle/
          retention-days: 30

  test:
    runs-on: windows-latest
    needs: [build-cli]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download CLI
        uses: actions/download-artifact@v4
        with:
          name: env-manager-cli
          path: bin/Release/net10.0/
      
      - name: Run Integration Tests
        run: |
          # Test basic commands
          .\bin\Release\net10.0\env-manager.exe list
          .\bin\Release\net10.0\env-manager.exe help
          
          # Test backup functionality
          .\bin\Release\net10.0\env-manager.exe backup --output test-backup.json
          
          # Test validate
          if (Test-Path test-backup.json) {
            .\bin\Release\net10.0\env-manager.exe validate test-backup.json
          }
          
          # Cleanup
          Remove-Item test-backup.json -ErrorAction SilentlyContinue

  release:
    needs: [lint, build-cli, build-gui, test]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
      
      - name: Prepare Release Assets
        run: |
          $version = "${{ github.ref }}" -replace 'refs/tags/v', ''
          
          # Organize release files
          mkdir -p release-files
          Copy-Item release-artifacts/env-manager-cli/env-manager.exe release-files/env-manager-$version.exe
          
          # Look for MSI installers
          if (Test-Path release-artifacts/env-manager-gui) {
            Get-ChildItem release-artifacts/env-manager-gui -Filter *.msi -Recurse | ForEach-Object {
              Copy-Item $_.FullName release-files/env-manager-$version.msi
            }
          }
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          draft: false
          prerelease: false
          body: |
            ## Release ${{ github.ref_name }}
            
            ### Downloads
            - **CLI**: env-manager-${{ github.ref_name }}.exe
            - **GUI (MSI)**: env-manager-${{ github.ref_name }}.msi (if available)
            
            ### Security
            - Security audit: Passed (0 findings)
            - See SECURITY_AUDIT.md for details
            
            ### Changes
            See CHANGELOG.md for detailed changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
