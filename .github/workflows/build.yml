name: CI/CD Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: env-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # All actions are pinned to immutable commit SHAs for supply-chain integrity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce line-ending policy
        shell: powershell
        run: |
          # 1) git whitespace/CRLF error check (uses .gitattributes)
          $ws = & git diff --check 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git diff --check failed; whitespace/CRLF errors:"
            $ws | ForEach-Object { Write-Error $_ }
            exit 1
          }
          # 2) Scan tracked text files for stray CRLF (only .bat/.ps1/.cmd allowed CRLF)
          $crlfOk = @('.bat','.ps1','.cmd')
          $binExt = @('.png','.ico','.icns','.jpg','.jpeg','.gif','.webp','.exe','.dll','.node','.pdb','.msi','.so','.dylib','.bin','.zip','.gz','.tar','.7z')
          $bad = @()
          foreach ($f in (git ls-files)) {
            if ($f -like 'frontend/node_modules/*') { continue }
            $ext = [IO.Path]::GetExtension($f).ToLowerInvariant()
            if ($crlfOk -contains $ext) { continue }
            if ($binExt -contains $ext) { continue }
            if (-not (Test-Path $f)) { continue }
            $bytes = [IO.File]::ReadAllBytes($f)
            if ($bytes.Length -gt 1MB) { continue }
            $hasCrlf = $false
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 13 -and $i + 1 -lt $bytes.Length -and $bytes[$i+1] -eq 10) {
                $hasCrlf = $true; break
              }
            }
            if ($hasCrlf) { $bad += $f }
          }
          if ($bad.Count -gt 0) {
            Write-Error "Unexpected CRLF in text files (expected LF; .gitattributes policy):"
            $bad | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'Line-ending policy OK'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: |
            frontend/src-tauri -> target
            service -> target
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build CLI
        run: dotnet build -c Release

      - name: Stage CLI artifacts into Tauri resource dir (issue 17)
        shell: pwsh
        run: |
          # The Tauri crate's build script (tauri_build::build) validates the
          # tauri.conf.json bundle.resources on every cargo compile of that
          # crate. Locally frontend/scripts/prebuild.mjs stages these files
          # during "npm run build"/"tauri build"; the verify job runs cargo
          # directly, so stage the five declared resources here. Fail-closed:
          # a missing source file fails the job.
          $cliDir = 'bin/Release/net10.0-windows'
          $dst = 'frontend/src-tauri/bin'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $missing = @()
          foreach ($f in @('env-manager-cli.exe', 'env-manager-cli.dll', 'env-manager-cli.runtimeconfig.json', 'env-manager-cli.deps.json')) {
            $src = Join-Path $cliDir $f
            if (Test-Path $src) {
              Copy-Item $src -Destination (Join-Path $dst $f) -Force
              Write-Host "staged: $f"
            } else {
              $missing += $src
            }
          }
          if (Test-Path 'AGENTS.cli.md') {
            Copy-Item 'AGENTS.cli.md' -Destination (Join-Path $dst 'AGENTS.cli.md') -Force
            Write-Host "staged: AGENTS.cli.md"
          } else {
            $missing += 'AGENTS.cli.md'
          }
          if ($missing.Count -gt 0) {
            Write-Host "=== CLI resource staging FAILED: $($missing.Count) of 5 missing ==="
            $missing | ForEach-Object { Write-Host "MISSING: $_" }
            exit 1
          }
          Write-Host "=== CLI resource staging OK: 5/5 files present in $dst ==="
          # tauri::generate_context! (main.rs) also validates the frontendDist
          # path ("../../dist" = repo-root dist/) at compile time; the real
          # dist/ is produced by the "Build frontend" step later in the job,
          # so seed a placeholder (vite build overwrites index.html).
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Set-Content -Path 'dist/index.html' -Value '<!doctype html><title>CI placeholder</title>'
          Write-Host 'seeded: dist/index.html placeholder for frontendDist'

      - name: Run C# engine unit tests
        run: dotnet test tests/EnvManager.Engine.Tests/EnvManager.Engine.Tests.csproj -c Release --nologo

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Run service crate tests (IPC schema contract)
        working-directory: service
        run: cargo test --locked

      - name: Run Tauri crate tests (IPC payload contract)
        working-directory: frontend/src-tauri
        run: cargo test --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: |
          cargo audit --file frontend/src-tauri/Cargo.lock
          cargo audit --file service/Cargo.lock

      - name: Audit NuGet dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Run Pester integration tests
        shell: pwsh
        env:
          # CI user-state isolation (issue 24): redirect every CLI user-state write
          # (profiles.json, audit, secret mounts, provider config, protection stores)
          # into this job-private directory. The runner's real user profile stays
          # untouched, so integration runs can neither pollute nor be polluted by
          # later steps. Requires the ENVMANAGER_LOCALAPPDATA seam in src/CliRuntime.cs
          # (GetFolderPath does NOT honor a process-level LOCALAPPDATA override).
          ENVMANAGER_LOCALAPPDATA: ${{ runner.temp }}\test-user-state
        run: |
          # Tier 3: integration tests that invoke env-manager-cli.exe
          # Build CLI step above has produced the binary;
          # the unit-test step has run vitest (mocked, no binary).
          # This step runs Pester 5 + the raw ps1 harnesses.
          New-Item -ItemType Directory -Force -Path $env:ENVMANAGER_LOCALAPPDATA | Out-Null
          Write-Host "=== issue 24 user-state isolation: ENVMANAGER_LOCALAPPDATA=$env:ENVMANAGER_LOCALAPPDATA ==="
          # Record pre-run state of the real profile dir for the isolation assertion
          # (the runner image may legitimately ship one; never delete anything there).
          $real = Join-Path $env:LOCALAPPDATA 'EnvManager'
          "ISSUE24_REAL_DIR_EXISTED=$(Test-Path $real)" | Add-Content $env:GITHUB_ENV
          ./scripts/run-ci-tests.ps1 -ResultsDir test-results -CliExe (Join-Path $PWD 'bin\Release\net10.0-windows\env-manager-cli.exe')

      - name: Assert user-state isolation (issue 24)
        if: always()
        shell: pwsh
        env:
          ENVMANAGER_LOCALAPPDATA: ${{ runner.temp }}\test-user-state
        run: |
          # Two-level isolation discipline (issue 24): machine-state writes are
          # harmless on a fresh VM; user-state writes must not leak into the real
          # runner profile during the job.
          $real = Join-Path $env:LOCALAPPDATA 'EnvManager'
          if ($env:ISSUE24_REAL_DIR_EXISTED -eq 'False') {
            if (Test-Path $real) { throw "user-state pollution: $real was created by this run (redirect did not hold)" }
            Write-Host "user-state isolation OK: real EnvManager dir not created by this run"
          } else {
            Write-Host "real EnvManager dir pre-existed (image state); run-owned state redirected - see Pester step log"
          }
          $redirected = Join-Path $env:ENVMANAGER_LOCALAPPDATA 'EnvManager'
          if (Test-Path (Join-Path $redirected 'profiles.json')) {
            $files = Get-ChildItem $redirected -File | Select-Object -ExpandProperty Name
            Write-Host "redirect proof: job-private dir holds $($files.Count) state file(s): $($files -join ', ')"
          } else {
            Write-Warning "redirected EnvManager dir has no profiles.json at $redirected (suites may use per-suite fixtures)"
          }

      - name: Upload Pester JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pester-junit-results
          path: test-results/*.junit.xml
          if-no-files-found: ignore

      - name: Documentation sync check
        shell: pwsh
        run: |
          ./scripts/check-doc-sync.ps1

      - name: i18n README drift check
        shell: pwsh
        run: |
          ./scripts/check-readme-i18n.ps1

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check Rust shell
        working-directory: frontend/src-tauri
        run: cargo check --locked

      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  # Issue 15 (architecture-recovery): L1 emulator matrix for the secret-provider contract
  # suite. Runs the container-backed + CLI-tool backends (Vault dev server, LocalStack,
  # Lowkey Vault, 1Password op CLI against the in-repo Connect mock, sops+age) on the Linux
  # container runner; Windows-only backends (Credential Manager, pwsh SecretStore) skip
  # here with platform reasons and run on the windows verify job instead.
  verify-l1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Docker availability (issue 15 checkpoint A)
        run: "docker version --format 'Docker server: {{.Server.Version}}'"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install PowerShell SecretManagement modules (issue 15 PS-SecretStore backend)
        shell: pwsh
        run: Install-PSResource Microsoft.PowerShell.SecretManagement,Microsoft.PowerShell.SecretStore -Scope CurrentUser -TrustRepository || Install-Module Microsoft.PowerShell.SecretManagement,Microsoft.PowerShell.SecretStore -Scope CurrentUser -Force

      - name: Run L1 secret-provider contract tests (Testcontainers matrix)
        run: dotnet test tests/EnvManager.Engine.Tests/EnvManager.Engine.Tests.csproj -c Release --nologo -p:EnableWindowsTargeting=true --filter "Category=L1"
        env:
          EM_L1_MATRIX: "1"

  package:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: |
            frontend/src-tauri -> target
            service -> target
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install root build tooling (archiver etc.)
        run: npm ci

      - name: Install WiX 3.14 tools
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          if (-not (Test-Path (Join-Path $wixDir 'candle.exe'))) {
            $zip = Join-Path $env:TEMP 'wix314-binaries.zip'
            Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $wixDir -Force
          }
          # windows-2025 image preset WIX points to a removed dir; pin our extracted path
          Add-Content $env:GITHUB_ENV "WIX=$wixDir"
          Test-Path (Join-Path $wixDir 'candle.exe') | Out-Host

      - name: Build portable, CLI-only, and MSI distributions
        run: node scripts/build.mjs --arch x64

      - name: Verify package layout, ZIPs, and MSI naming
        shell: powershell
        run: |
          if (-not (Test-Path 'release/portable/env-manager.exe')) { throw 'GUI executable missing' }
          if (-not (Test-Path 'release/portable/env-manager-cli.exe')) { throw 'CLI executable missing' }
          if (-not (Test-Path 'release/portable/AGENTS.cli.md')) { throw 'CLI agent guide missing' }
          if (-not (Test-Path 'release/cli-only/env-manager-cli.exe')) { throw 'CLI-only exe missing' }
          if (-not (Test-Path 'release/portable/Env-Manager_portable_*_x64.zip')) { throw 'Portable ZIP missing' }
          if (-not (Test-Path 'release/cli-only/Env-Manager_cli-only_*_x64.zip')) { throw 'CLI-only ZIP missing' }
          $msi = Get-ChildItem 'release/msi/*.msi'
          if ($msi.Count -ne 1) { throw 'Expected exactly one MSI' }
          if ($msi.Name -match '_[a-zA-Z]{2}-[a-zA-Z]{2,3}\.msi') { throw 'Localized MSI suffix is forbidden' }

      - name: MSI install/uninstall smoke test
        shell: pwsh
        run: |
          $msi = (Get-ChildItem 'release/msi/*.msi')[0].FullName
          $log = Join-Path $env:TEMP 'env-manager-msi-smoke.log'
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/log', "`"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "MSI install failed (exit $($install.ExitCode))" }
          $installDir = 'C:\Program Files\Env Manager'
          foreach ($f in @('env-manager.exe', 'env-manager-cli.exe')) {
            if (-not (Test-Path (Join-Path $installDir $f))) { throw "Installed file missing: $f" }
          }
          $probe = & (Join-Path $installDir 'env-manager-cli.exe') 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI probe failed: $probe" }
          if (-not ("$probe" -match 'v\d+\.\d+\.\d+')) { throw "Installed CLI probe missing version banner: $probe" }
          $uninstall = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart', '/log', "`"$log.uninstall.log`"" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed (exit $($uninstall.ExitCode))" }
          if (Test-Path (Join-Path $installDir 'env-manager.exe')) { throw 'Uninstall left env-manager.exe behind' }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: env-manager-portable
          path: |
            release/portable/*
            release/portable/Env-Manager_portable_*_x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: env-manager-cli-only
          path: |
            release/cli-only/*
            release/cli-only/Env-Manager_cli-only_*_x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: env-manager-msi
          path: release/msi/*.msi
          if-no-files-found: error

  verify-arch:
    runs-on: windows-latest
    timeout-minutes: 25
    needs: verify
    strategy:
      matrix:
        arch: [x86, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: i686-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Verify CLI compiles for arch
        run: |
          dotnet build -c Release -r ${{ matrix.arch == 'x86' && 'win-x86' || matrix.arch == 'arm64' && 'win-arm64' || 'win-x64' }}


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    needs: package
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches project versions
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $csproj = ([xml](Get-Content env-manager.csproj)).Project.PropertyGroup.Version
          $tauri = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $csproj -or $tag -ne $tauri -or $tag -ne $pkg) {
            throw "Version mismatch: tag=$tag csproj=$csproj tauri=$tauri package.json=$pkg"
          }
          "Version gate OK: $tag"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: env-manager-*
          merge-multiple: true
          path: artifacts

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: artifacts/*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true


  # Ticket 18 (architecture-recovery): on-demand Stryker mutation short run.
  # Config gate stays in stryker-config.json (mutate four red-line files, thresholds 85/70/60,
  # ignore string/logical - locked, do not tune). This job is a workflow_dispatch convenience:
  # the brain session triggers it to produce the rerun evidence + per-module scores
  # (scripts/stryker-module-scores.mjs) and uploads the full HTML report as an artifact.
  stryker:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools (dotnet-stryker 4.16.0)
        run: dotnet tool restore

      - name: Run Stryker mutation analysis
        run: dotnet stryker
        env:
          EM_DIFFERENTIAL_ORACLE: ""
          EM_L1_MATRIX: ""

      - name: Per-module mutation scores
        run: |
          report="$(find StrykerOutput -type f -name mutation-report.html | sort | tail -1)"
          echo "report: $report"
          test -n "$report"
          node scripts/stryker-module-scores.mjs "$report" | tee stryker-module-scores.txt
          cp "$report" mutation-report.html

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stryker-mutation-report
          path: |
            mutation-report.html
            stryker-module-scores.txt
          if-no-files-found: error
