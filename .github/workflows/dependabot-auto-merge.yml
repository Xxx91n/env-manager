name: Dependabot auto-merge (patch-only, gated)

# Dependabot 成熟治理（architecture-recovery ticket 31）
# 目的：仅对 patch 组 dependabot PR 自动合并；前提：
#   1) 仅 patch update-type（minor/major 永远单 PR 人工评审）
#   2) required CI（build.yml verify）结论为 success
#   3) required dependency-review（dependency-review.yml）结论为 success
#   4) 非 draft
#   5) PR 作者是 dependabot[bot]
#   6) required checks 有界轮询等待（45 min）——修复与 CI 并行触发的竞态（ticket 48）
# 安全：
#   - 事件：pull_request（明确禁用 pull_request_target——Boost Security Labs 实证
#     github.actor 混淆 + @dependabot recreate 武器化攻击；详见
#     research/round5-mental-models.md 信源 #13）
#   - PR 标题带 `bump` / `dependencies` 字样的非 dependabot 提交者一律拒绝
#   - squash 合并保留单 commit，触发 release-please 走 chore(deps) 路径（不 bump 版本）

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# PR 上下文只读；auto-merge 步骤需要 contents:write + pull-requests:write
# 由具体 job 的 permissions 覆盖；workflow 默认只给最小 read
permissions:
  contents: read

concurrency:
  # dependabot 会一次推多组 PR；每 PR 独立锁，避免互相取消
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge patch Dependabot PRs
    runs-on: ubuntu-latest
    # 60 min：gate-checks 对 required checks 做有界轮询（45 min 上限），见下方步骤 3
    timeout-minutes: 60
    # 双重闸门：PR 作者必须是 dependabot；PR 不能是 draft
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 0) 门卫：非 Dependabot 作者的 PR（release-please 等机器 PR / 人工 PR）第一步立即
      #    成功退出，不进入元数据与闸门链路（修复 release-please PR 上 run 34435772242
      #    的挂起失败模式；作者名单兼容 dependabot[bot] 与 app/dependabot 两种 actor 形态）
      - name: Skip non-Dependabot PRs (early success exit)
        if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'app/dependabot'
        env:
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
        run: |
          echo "PR author '${PR_AUTHOR}' is not dependabot[bot]; skipping auto-merge pipeline"
          {
            echo "### dependabot auto-merge skipped (non-Dependabot author)"
            echo "- author: ${PR_AUTHOR}"
            echo "- reason: only Dependabot-authored PRs enter the auto-merge gate"
          } >> "$GITHUB_STEP_SUMMARY"

      # 0.5) checkout 仅用于在 workflow 上下文里运行 gh CLI 时引用 head SHA；
      # 不做真实构建，actions/checkout 固定 SHA 由仓库既有 commit-pinning 纪律保证
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1) 拉 Dependabot PR 元数据；权威 action：dependabot/fetch-metadata v2.3.0（SHA pin）
      #    仅 Dependabot 作者执行——fetch-metadata 对非 dependabot PR 会直接报错
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot'
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2.3.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # 2) 闸门 1：仅 patch update-type
      - name: Gate on patch-only update-type
        id: gate-patch
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          {
            echo "update-type=${{ steps.metadata.outputs.update-type }}"
            echo "dependency-names=${{ steps.metadata.outputs.dependency-names }}"
            echo "dependency-type=${{ steps.metadata.outputs.dependency-type }}"
          } >> "$GITHUB_OUTPUT"

      # 3) 闸门 2：required CI + dependency-review 必须绿（有界轮询等待）
      # 本 workflow 与 build.yml 由同一 PR 事件并行触发——历史实现在启动后 ~6 秒一次性快照
      # check-runs，required check（verify 全量构建约 11-15 分钟）不可能已绿，构成竞态
      # （#55 run 34430050727 FAILURE 模式）。改为轮询：每个 required check 出现结论即判定
      # （success 放行；failure/cancelled 等立即拒绝），45 分钟上限内未齐则明确超时拒绝。
      # 说明：两个目标均为 Actions check-runs，不再合并查询旧式 status contexts API。
      - name: Gate on CI + dependency-review green (bounded wait)
        id: gate-checks
        if: steps.gate-patch.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PR_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 2700 ))
          echo "waiting for required checks on head ${PR_HEAD_SHA} (bounded: 45 min)"
          while :; do
            json="$(gh api "repos/${PR_REPO}/commits/${PR_HEAD_SHA}/check-runs" --paginate)"
            verdict="$(printf '%s' "$json" | python3 -c '
import json, sys
data = json.load(sys.stdin)
want = ("CI/CD Build and Release / verify", "Dependency Review / dependency-review")
found = {}
for cr in data.get("check_runs", []):
    name = cr.get("name")
    if name in want:
        found[name] = cr.get("conclusion") or "pending"
for w in want:
    print(w + "=" + str(found.get(w, "pending")))
')"
            echo "--- required-check poll at $(date -u +%H:%M:%S) ---"
            printf '%s\n' "$verdict"
            if grep -Eq '=(failure|cancelled|timed_out|startup_failure|action_required|stale|skipped)$' <<<"$verdict"; then
              echo "::error::a required check concluded unsuccessfully on head ${PR_HEAD_SHA}; auto-merge refused"
              exit 1
            fi
            if ! grep -q '=pending$' <<<"$verdict"; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out after 45 min waiting for required checks on head ${PR_HEAD_SHA}; auto-merge refused"
              exit 1
            fi
            sleep 30
          done
          echo "all required checks green on head ${PR_HEAD_SHA}"

      # 4) auto-merge：用 gh pr merge --auto (squash)，保留单 commit 触发 release-please 走 chore(deps) 路径
      - name: Enable auto-merge (squash)
        if: |
          steps.gate-patch.outputs.update-type == 'version-update:semver-patch' &&
          steps.gate-checks.conclusion == 'success'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_URL: "${{ github.event.pull_request.html_url }}"
        run: |
          gh pr merge --auto --squash "$PR_URL"
          echo "auto-merge enabled for $PR_URL"
          {
            echo "merged-by=dependabot-auto-merge@v1"
            echo "update-type=${{ steps.metadata.outputs.update-type }}"
            echo "dependency-names=${{ steps.metadata.outputs.dependency-names }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 5) 失败时清楚标注（不静默跳过）
      - name: Annotate skipped auto-merge (non-blocking)
        if: failure() && steps.gate-patch.outputs.update-type != 'version-update:semver-patch'
        run: |
          {
            echo "### dependabot auto-merge skipped"
            echo "- update-type: \`${{ steps.metadata.outputs.update-type }}\`"
            echo "- reason: only patch (semver-patch) update-types are eligible"
            echo "- dependency-names: \`${{ steps.metadata.outputs.dependency-names }}\`"
            echo "- expected: minor/major Dependabot PRs require manual review"
          } >> "$GITHUB_STEP_SUMMARY"

      # 6) 分类依据明示（always：无论放行/跳过/拒绝都在 step summary 留下判定依据；
      #    对应 issue 48 / D-008② 「在 gate 输出明示分类依据」）
      - name: Summarize classification (always)
        if: always()
        env:
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          UPDATE_TYPE: "${{ steps.metadata.outputs.update-type }}"
          DEP_NAMES: "${{ steps.metadata.outputs.dependency-names }}"
        run: |
          {
            echo "### dependabot auto-merge classification"
            echo "- author: ${PR_AUTHOR}"
            echo "- update-type: ${UPDATE_TYPE}"
            echo "- dependency-names: ${DEP_NAMES}"
            echo "- eligibility: author=dependabot AND update-type=semver-patch AND required checks green"
          } >> "$GITHUB_STEP_SUMMARY"