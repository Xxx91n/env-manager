name: Mirror to GitLab and Codeberg

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: env-manager-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeberg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: qte77/gha-github-mirror-action@3c8bd03d1c17576cb085090320fe01149a663158 # main@2026-08-27
        with:
          source_repo: https://github.com/Xxx91n/env-manager.git
          codeberg_url: 'https://codeberg.org/${{ vars.CODEBERG_USER }}/env-manager.git'
          codeberg_pat: ${{ secrets.CODEBERG_TOKEN }}

  gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: qte77/gha-github-mirror-action@3c8bd03d1c17576cb085090320fe01149a663158 # main@2026-08-27
        with:
          source_repo: https://github.com/Xxx91n/env-manager.git
          gitlab_url: 'https://gitlab.com/${{ vars.GITLAB_USER }}/env-manager.git'
          gitlab_pat: ${{ secrets.GITLAB_TOKEN }}
