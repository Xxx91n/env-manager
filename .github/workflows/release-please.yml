name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          release-type: simple
          package-name: env-manager
          # Ticket 45 (v0.12.0 release establishment): tags follow the repo
          # convention vX.Y.Z (matches build.yml tags: ['v*'] and the v0.12.0
          # tag), so disable the default env-manager-v component prefix. The
          # manifest pins the released version; extra-files keep the version
          # carriers the build.yml release job's version gate checks in
          # lockstep with the manifest.
          include-component-in-tag: false
          manifest-file: .release-please-manifest.json
          extra-files: |
            env-manager.csproj
            frontend/src-tauri/tauri.conf.json
            frontend/package.json
