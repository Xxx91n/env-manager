name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # The tag → build.yml bridge below uses workflow_dispatch, which needs this.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # release-please reads release-please-config.json: release-type,
          # plain vX.Y.Z tags (include-component-in-tag: false), and the
          # extra-files that keep the three version carriers in lockstep with
          # the manifest. Do not pass release-type inline: the action then
          # builds an inline manifest and ignores the config file.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN-created tags emit no push event that can start another
      # workflow (GitHub's recursion guard), so build.yml's tag trigger never
      # sees a release-please tag. workflow_dispatch is the documented
      # exception. The dispatched run still sees github.ref=refs/tags/vX.Y.Z,
      # so build.yml's version gate and release job apply.
      - name: Dispatch build.yml for the new tag
        if: ${{ !cancelled() && steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "release-please created $TAG; dispatching build.yml at the tag ref"
          gh workflow run build.yml --ref "$TAG"
