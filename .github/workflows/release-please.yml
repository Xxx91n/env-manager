name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # The tag → build.yml bridge below uses workflow_dispatch, which needs this.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          release-type: simple
          package-name: env-manager
          # (v0.12.0 release establishment): tags follow the repo
          # convention vX.Y.Z (matches build.yml tags: ['v*'] and the v0.12.0
          # tag), so disable the default env-manager-v component prefix. The
          # manifest pins the released version; extra-files keep the version
          # carriers the build.yml release job's version gate checks in
          # lockstep with the manifest.
          include-component-in-tag: false
          manifest-file: .release-please-manifest.json
          extra-files: |
            env-manager.csproj
            frontend/src-tauri/tauri.conf.json
            frontend/package.json

      # GITHUB_TOKEN-created tags emit no push event that can start another
      # workflow (GitHub's recursion guard), so build.yml's tag trigger never
      # sees a release-please tag. workflow_dispatch is the documented
      # exception. The dispatched run still sees github.ref=refs/tags/vX.Y.Z,
      # so build.yml's version gate and release job apply.
      - name: Dispatch build.yml for the new tag
        if: ${{ !cancelled() && steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "release-please created $TAG; dispatching build.yml at the tag ref"
          gh workflow run build.yml --ref "$TAG"
