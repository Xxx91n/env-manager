# SharpFuzz nightly fuzzing over the CLI argument-parse surface (issue 25).
#
# Modes:
# - pull_request: short run (5 min budget). continue-on-error keeps the PR green
#   (non-blocking by design); crashes still upload artifacts for triage.
# - workflow_dispatch: manual/brain-session run, optional time override.
# - schedule: nightly long run on main (crash => red run = the real signal).
#
# Supply chain: the libfuzzer-dotnet driver is downloaded from a pinned
# immutable release tag and its SHA256 is logged; harness + engine are built
# from the checked-out commit. SharpFuzz is pinned to 2.3.0 (matches the
# harness PackageReference; LibFuzzer mode exists since 2.3.0).
name: Fuzz (SharpFuzz nightly)

on:
  schedule:
    # Nightly long run, 18:30 UTC (early morning Beijing) on main.
    - cron: '30 18 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'env-manager.csproj'
      - 'tests/EnvManager.Fuzz/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 'libFuzzer -max_total_time seconds (empty = 1800)'
        required: false
        default: '1800'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARPFUZZ_VERSION: '2.3.0'
  DRIVER_URL: 'https://github.com/Metalnem/libfuzzer-dotnet/releases/download/v2025.05.02.0904/libfuzzer-dotnet-windows.exe'
  # SHA256 recorded from the first CI run (2026-09-05, run 33943975560).
  DRIVER_SHA256: '17AF5B3F6FF4D2C57B44B9A35C13051B570EB66F0557D00015DF3832709050BF'

jobs:
  fuzz:
    runs-on: windows-latest
    timeout-minutes: 60
    # PR short runs must not block PRs; nightly/dispatch runs must stay red on crash.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      FUZZ_TIME: ${{ github.event_name == 'pull_request' && '300' || (inputs.max_total_time != '' && inputs.max_total_time || '1800') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce line-ending policy
        shell: powershell
        run: |
          # Same policy gate as build.yml verify (first step after checkout).
          $ws = & git diff --check 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "git diff --check failed"; exit 1 }
          Write-Host 'Line-ending policy OK'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Publish fuzz harness (IL-only, no R2R)
        shell: pwsh
        run: |
          # -p:PublishReadyToRun=false is enforced in the csproj, re-asserted here
          # so a global Directory.Build.props change can never silently break
          # SharpFuzz instrumentation (R2R code bypasses IL rewriting).
          dotnet publish tests/EnvManager.Fuzz/EnvManager.Fuzz.csproj -c Release -o fuzz/out -p:PublishReadyToRun=false -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path 'fuzz/out/EnvManager.Fuzz.dll')) { throw 'harness dll missing' }
          if (-not (Test-Path 'fuzz/out/env-manager-cli.dll')) { throw 'engine dll missing' }

      - name: Install SharpFuzz instrumenter (pinned ${{ env.SHARPFUZZ_VERSION }})
        run: dotnet tool install --global SharpFuzz.CommandLine --version ${{ env.SHARPFUZZ_VERSION }}

      - name: Instrument engine assembly
        shell: pwsh
        run: |
          # Instrument only the engine (the parse surface under test). The harness
          # DLL, SharpFuzz.Common.dll and dnlib.dll must stay uninstrumented
          # (official fuzz-libfuzzer.ps1 exclusion list).
          sharpfuzz "$PWD/fuzz/out/env-manager-cli.dll"
          if ($LASTEXITCODE -ne 0) { throw "sharpfuzz instrumentation failed (exit $LASTEXITCODE)" }

      - name: Download libFuzzer driver (pinned release) and record SHA256
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:DRIVER_URL -OutFile fuzz/out/libfuzzer-dotnet.exe
          $hash = (Get-FileHash 'fuzz/out/libfuzzer-dotnet.exe' -Algorithm SHA256).Hash
          Write-Host "driver sha256: $hash"
          if ($hash -ne $env:DRIVER_SHA256) { throw "driver sha256 mismatch: got $hash, expected $env:DRIVER_SHA256" }
          Add-Content $env:GITHUB_STEP_SUMMARY "libfuzzer-dotnet driver SHA256: ``$hash``"

      - name: Smoke-run harness on seed corpus (standalone mode)
        shell: pwsh
        run: |
          # Fuzzer.LibFuzzer.Run falls back to file mode outside the driver:
          # executes each seed once, exercising the harness + exit code.
          $fail = 0
          Get-ChildItem 'tests/EnvManager.Fuzz/Corpus' -File | ForEach-Object {
            dotnet fuzz/out/EnvManager.Fuzz.dll $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "seed failed: $($_.Name) (exit $LASTEXITCODE)"; $fail++ }
          }
          if ($fail -gt 0) { throw "$fail seed(s) failed standalone smoke run" }
          Write-Host 'seed smoke run OK'

      - name: Run libFuzzer (PR short run / nightly long run)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path fuzz/artifacts, fuzz/corpus-grown | Out-Null
          Write-Host "FUZZ_TIME=${env:FUZZ_TIME}s event=${{ github.event_name }}"
          # First corpus dir is writable (grown units), second is the read-only
          # in-repo seed corpus. Crashes land in -artifact_prefix.
          & fuzz/out/libfuzzer-dotnet.exe `
            -timeout=10 -rss_limit_mb=4096 -max_len=4096 `
            "-max_total_time=$env:FUZZ_TIME" `
            -print_final_stats=1 `
            -artifact_prefix="$PWD/fuzz/artifacts/" `
            --target_path=dotnet --target_arg="$PWD/fuzz/out/EnvManager.Fuzz.dll" `
            fuzz/corpus-grown tests/EnvManager.Fuzz/Corpus 2>&1 | Tee-Object -FilePath fuzz/fuzz-run.log
          $code = $LASTEXITCODE
          $crashes = @(Get-ChildItem 'fuzz/artifacts' -File -ErrorAction SilentlyContinue)
          Write-Host "libFuzzer exit=$code crash-artifacts=$($crashes.Count)"
          Add-Content $env:GITHUB_STEP_SUMMARY "fuzz duration: ${env:FUZZ_TIME}s; exit=$code; crash artifacts: $($crashes.Count)"
          if ($code -ne 0) { throw "libFuzzer exited $code (crash or OOM/timeout limit)" }

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-results-${{ github.run_id }}
          path: |
            fuzz/fuzz-run.log
            fuzz/artifacts/**
            fuzz/corpus-grown/**
          if-no-files-found: ignore
