name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.7.14)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            triple: x86_64-pc-windows-msvc
            label: x64
          - arch: x86
            rid: win-x86
            triple: i686-pc-windows-msvc
            label: x86
          - arch: arm64
            rid: win-arm64
            triple: aarch64-pc-windows-msvc
            label: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build all packages for ${{ matrix.label }}
        run: node scripts/build.mjs --arch ${{ matrix.arch }}

      - name: Verify portable
        shell: powershell
        run: |
          if (-not (Test-Path 'release/portable/env-manager.exe')) { throw 'Portable exe missing' }
          if (-not (Test-Path 'release/portable/env-manager-cli.exe')) { throw 'CLI exe missing' }

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-${{ matrix.label }}
          path: |
            release/portable/Env-Manager_portable_*.zip
            release/portable/*
          if-no-files-found: error

      - name: Upload CLI-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-only-${{ matrix.label }}
          path: |
            release/cli-only/Env-Manager_cli-only_*.zip
            release/cli-only/*
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msi-${{ matrix.label }}
          path: release/msi/*.msi
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ inputs.version }}
          name: Env Manager v${{ inputs.version }}
          body: |
            ## Env Manager Downloads

            - Portable: release/portable/Env-Manager_portable_version_arch.zip (x64/x86/arm64)
            - CLI-only: release/cli-only/Env-Manager_cli-only_version_arch.zip (x64/x86/arm64)
            - MSI: Env Manager_version_arch.msi (x64/x86/arm64)

            ## Changelog

            See [CHANGELOG.md](https://github.com/Xxx91n/env-manager/blob/main/CHANGELOG.md) for full details.
          files: |
            artifacts/Env-Manager_portable_*.zip
            artifacts/Env-Manager_cli-only_*.zip
            artifacts/*.msi
          draft: false
          prerelease: false
