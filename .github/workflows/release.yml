name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.9.12)'
        required: true
        type: string
      create_release:
        description: 'Publish GitHub Release (uncheck for build-only)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            triple: x86_64-pc-windows-msvc
            label: x64
          - arch: x86
            rid: win-x86
            triple: i686-pc-windows-msvc
            label: x86
          - arch: arm64
            rid: win-arm64
            triple: aarch64-pc-windows-msvc
            label: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build all packages for ${{ matrix.label }}
        run: node scripts/build.mjs --arch ${{ matrix.arch }}

      - name: Verify portable
        shell: powershell
        run: |
          if (-not (Test-Path 'release/portable/env-manager.exe')) { throw 'Portable exe missing' }
          if (-not (Test-Path 'release/portable/env-manager-cli.exe')) { throw 'CLI exe missing' }

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-${{ matrix.label }}
          path: |
            release/portable/Env-Manager_portable_*.zip
          if-no-files-found: error

      - name: Upload CLI-only artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-only-${{ matrix.label }}
          path: |
            release/cli-only/Env-Manager_cli-only_*.zip
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: msi-${{ matrix.label }}
          path: release/msi/*.msi
          if-no-files-found: warn

  release:
    needs: build
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ inputs.version }}
          name: Env Manager v${{ inputs.version }}
          body: |
            ## Env Manager Downloads

            - **Portable**: Env-Manager_portable_${{ inputs.version }}_x64.zip / _x86.zip / _arm64.zip
            - **CLI-only**: Env-Manager_cli-only_${{ inputs.version }}_x64.zip / _x86.zip / _arm64.zip
            - **MSI**: Env Manager_${{ inputs.version }}_x64.msi / _x86.msi / _arm64.msi

            ## Prerequisites

            - .NET 10 Desktop Runtime: https://dotnet.microsoft.com/download/dotnet/10.0
            - WebView2 Runtime (preinstalled on Windows 11)

            ## Changelog

            See [CHANGELOG.md](https://github.com/Xxx91n/env-manager/blob/main/CHANGELOG.md) for full details.
          files: |
            artifacts/Env-Manager_portable_*.zip
            artifacts/Env-Manager_cli-only_*.zip
            artifacts/*.msi
          draft: false
          prerelease: false

