name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Before proceeding, please search existing issues to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Detailed steps to reproduce the behavior.
      value: |
        1. Run `env-manager-cli ...`
        2. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Env Manager version
      description: Run `env-manager-cli` with no args to see the version.
      placeholder: "0.9.11"
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x64
        - x86
        - arm64
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Interface
      options:
        - CLI
        - GUI (Tauri)
        - Service
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "Windows 11 23H2 22631.xxxx"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant log lines from `logs/env-manager.log` or `logs/env-manager-service.log`. Do NOT paste secret values.
      render: shell
    validations:
      required: false