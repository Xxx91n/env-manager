[package]
name = "env-manager-service"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
description = "Env Manager secret lifecycle service (Phase B+C v0.9.0)"

[[bin]]
name = "env-manager-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
